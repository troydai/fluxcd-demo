kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fluxcd-demo
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    # Expose HTTP/HTTPS on localhost so an ingress controller deployed by Flux is reachable.
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
